<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="grid-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; font-size: 52px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 22px; fill: #cbd5e1; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #a5b4fc; }
    
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.8; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes float1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(12px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .animated-bg-circle { animation: pulse 6s infinite ease-in-out; transform-origin: center; }
    .floating-node-1 { animation: float1 4s infinite ease-in-out; }
    .floating-node-2 { animation: float2 5s infinite ease-in-out; }
    .flow-line { stroke-dasharray: 8, 8; animation: dash 2s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)" rx="16" />
  
  <!-- Dynamic Background Circles (Behind text) -->
  <circle class="animated-bg-circle" cx="200" cy="100" r="180" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  <circle class="animated-bg-circle" cx="1000" cy="300" r="220" fill="#ec4899" opacity="0.12" filter="url(#glow)" />

  <!-- Grid Lines -->
  <path d="M 0 300 L 1200 300 M 0 200 L 1200 200 M 0 100 L 1200 100" stroke="#334155" stroke-width="1" opacity="0.3" />
  <path d="M 200 0 L 200 400 M 400 0 L 400 400 M 600 0 L 600 400 M 800 0 L 800 400 M 1000 0 L 1000 400" stroke="#334155" stroke-width="1" opacity="0.3" />

  <!-- Animated Workflow Nodes & Connections (In Background / Decorative Sides) -->
  <g class="floating-node-1" opacity="0.6">
    <path class="flow-line" d="M 850 120 L 980 180 L 920 280" stroke="#818cf8" stroke-width="2" fill="none" />
    <rect x="810" y="95" width="80" height="50" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="2" />
    <text x="850" y="125" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold">AGENT</text>
    
    <rect x="940" y="155" width="80" height="50" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2" />
    <text x="980" y="185" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold">TOOLS</text>
    
    <rect x="880" y="255" width="80" height="50" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
    <text x="920" y="285" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold">OUTPUT</text>
  </g>

  <!-- Foreground Main Content (Clear and Unobstructed) -->
  <g transform="translate(80, 0)">
    <!-- Pill Badge -->
    <rect x="0" y="75" width="280" height="34" rx="17" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <text x="140" y="97" class="badge-text" text-anchor="middle">🚀 CURATED AI ECOSYSTEM 2026</text>

    <!-- Main Title -->
    <text x="0" y="175" class="title">
      Awesome Agent
    </text>
    <text x="0" y="235" class="title" fill="url(#accent)">
      Workflow Platform 🤖
    </text>

    <!-- Subtitle -->
    <text x="0" y="295" class="subtitle">
      Visual AI Orchestration • Autonomous Multi-Agent Frameworks • Enterprise Automation
    </text>

    <!-- Decorative Line -->
    <rect x="0" y="325" width="450" height="4" rx="2" fill="url(#accent)" />
  </g>
</svg>
